name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: derlocke-ng/kiwi-server
          path: kiwi-server
      # The system Python (3.12 on ubuntu-24.04) carries PyGObject, GTK 4 and
      # libadwaita, so the GUI tests build real widgets under Xvfb.
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y -q python3-venv python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 xvfb
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install -q pydantic pytest ruff jinja2 pyyaml
      - run: .venv/bin/ruff check src tests containers && .venv/bin/ruff format --check src tests containers
      - run: xvfb-run -a .venv/bin/python -m pytest tests/unit -q
        env:
          KIWI_SERVER_SRC: ${{ github.workspace }}/kiwi-server
          PYTHONPATH: src:.
