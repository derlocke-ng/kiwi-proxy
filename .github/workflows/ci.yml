name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: derlocke-ng/kiwi-server
          path: kiwi-server
      # The system Python (3.12 on ubuntu-24.04) carries PyGObject, GTK 4 and
      # libadwaita, so the GUI tests build real widgets under Xvfb.
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y -q python3-venv python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 xvfb
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install -q pydantic pytest ruff jinja2 pyyaml
      - run: .venv/bin/ruff check src tests containers && .venv/bin/ruff format --check src tests containers
      - run: xvfb-run -a .venv/bin/python -m pytest tests/unit -q
        env:
          KIWI_SERVER_SRC: ${{ github.workspace }}/kiwi-server
          PYTHONPATH: src:.

  # The gateway image, built from a clean cache and started both ways kiwi-proxy
  # starts it, against a dummy SOCKS5 (tests/smoke/gateway.sh). The unit tests
  # passed while 0.2.0's gateway died at start, because nothing had ever run the
  # container; this does. images.yml is the publishing build for kiwi-server
  # machines and is not this.
  gateway-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: for f in tests/smoke/gateway.sh containers/gateway/entrypoint.sh; do bash -n "$f"; done
      - run: podman version && podman info --format '{{.Host.NetworkBackend}} rootless={{.Host.Security.Rootless}}'
      - name: build, without a cache that could hide a broken step
        run: podman build --no-cache -t kiwi-proxy/gateway:smoke -f containers/gateway/Containerfile containers/gateway
      - name: start it, with and without a host listener
        run: bash tests/smoke/gateway.sh kiwi-proxy/gateway:smoke
